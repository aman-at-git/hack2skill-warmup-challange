name: PR Quality Report

on:
  workflow_run:
    workflows: ['Quality Check']
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    name: Post Quality Report
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'

    steps:
      - name: Download quality reports
        uses: actions/download-artifact@v4
        with:
          name: quality-reports
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Compute quality score and post PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs')

            const conclusion = context.payload.workflow_run.conclusion

            // Parse ESLint report
            let eslintScore = 100
            let eslintErrors = 0
            let eslintWarnings = 0
            let eslintStatus = '✅'
            try {
              const raw = fs.readFileSync('eslint-report.json', 'utf-8')
              const data = JSON.parse(raw)
              eslintErrors = data.reduce((s, f) => s + f.errorCount, 0)
              eslintWarnings = data.reduce((s, f) => s + f.warningCount, 0)
              if (eslintErrors > 0) {
                eslintScore = Math.max(0, 100 - eslintErrors * 10)
                eslintStatus = '❌'
              }
            } catch {
              eslintScore = 0
              eslintStatus = '⚠️'
            }

            // Parse Vitest report
            let vitestScore = 100
            let vitestPassed = 0
            let vitestFailed = 0
            let vitestStatus = '✅'
            try {
              const raw = fs.readFileSync('vitest-report.json', 'utf-8')
              const data = JSON.parse(raw)
              vitestPassed = data.numPassedTests ?? 0
              vitestFailed = data.numFailedTests ?? 0
              const total = vitestPassed + vitestFailed
              vitestScore = total > 0 ? Math.round((vitestPassed / total) * 100) : 0
              if (vitestFailed > 0) vitestStatus = '❌'
            } catch {
              vitestScore = 0
              vitestStatus = '⚠️'
            }

            const buildStatus = conclusion === 'success' ? '✅' : '❌'
            const overallScore = Math.round((eslintScore + vitestScore) / 2)
            const scoreEmoji = overallScore >= 90 ? '🟢' : overallScore >= 70 ? '🟡' : '🔴'

            const eslintRow = `| ${eslintStatus} ESLint | ${eslintErrors} error(s), ${eslintWarnings} warning(s) | ${eslintScore}/100 |`
            const vitestRow = `| ${vitestStatus} Tests | ${vitestPassed} passed, ${vitestFailed} failed | ${vitestScore}/100 |`
            const typeRow = `| ✅ TypeScript | Type check completed | — |`
            const buildRow = `| ${buildStatus} Build | ${conclusion === 'success' ? 'Succeeded' : 'Failed'} | — |`

            const body = `## ${scoreEmoji} TripFlip Code Quality Report

**Overall Score: ${overallScore}/100**

| Check | Result | Score |
|-------|--------|-------|
${eslintRow}
${vitestRow}
${typeRow}
${buildRow}

<details>
<summary>How scores are calculated</summary>

- **ESLint**: 100 points, minus 10 per error
- **Tests**: percentage of tests passing (${vitestPassed}/${vitestPassed + vitestFailed})
- **Overall**: average of ESLint + Tests scores

</details>

_Generated by TripFlip Quality Bot — [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }})_`

            // Find the PR associated with this workflow run
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            })

            const matchingPR = prs.data.find(
              (pr) => pr.head.sha === context.payload.workflow_run.head_sha
            )

            if (matchingPR) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: matchingPR.number,
                body,
              })
              core.info(`Posted quality report to PR #${matchingPR.number}`)
            } else {
              core.warning('No matching open PR found for this workflow run')
            }
